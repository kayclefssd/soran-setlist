<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SORAN | 나만의 셋리스트</title><style>:root{font-family:system-ui,'Apple SD Gothic Neo',sans-serif;color:#203044;background:#f5f8ff}*{box-sizing:border-box}body{margin:0}header{background:#dceaff;padding:38px 20px;text-align:center}h1{margin:0 0 8px}p{color:#53657c}main{max-width:1000px;margin:28px auto;padding:0 18px;display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:white;border:1px solid #dbe5f5;border-radius:20px;padding:22px;box-shadow:0 8px 30px #2030440a}h2{margin:0 0 12px;font-size:20px}.search{width:100%;padding:12px;border:1px solid #cbd8ed;border-radius:10px;font-size:15px}.songs{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.song{border:1px solid #b6cdec;background:#f1f7ff;color:#1d497c;border-radius:999px;padding:10px 14px;cursor:pointer;font-size:14px}.song:hover{background:#d9eaff}.song:disabled{opacity:.35;cursor:default}.list{list-style:none;margin:16px 0;padding:0;min-height:160px}.item{display:flex;align-items:center;gap:9px;padding:12px;margin:8px 0;background:#f4f8ff;border:1px solid #dce6f4;border-radius:12px;touch-action:pan-y}.item.dragging{opacity:.45}.handle{cursor:grab;touch-action:none;color:#6783a7;font-size:21px}.name{flex:1}.number{color:#7390b4;font-weight:700;min-width:25px}.small{border:0;background:transparent;color:#5579a8;cursor:pointer;padding:5px;font-size:18px}.actions{display:flex;flex-wrap:wrap;gap:8px}.action{border:0;border-radius:10px;background:#316db1;color:white;padding:11px 14px;cursor:pointer}.action.secondary{background:#e7effb;color:#315783}.empty{color:#8b9bb0;text-align:center;padding:45px 5px}.hint{font-size:13px;margin-top:12px}@media(max-width:700px){main{grid-template-columns:1fr}header{padding:27px 15px}}</style></head><body><header><h1>🎤 나만의 셋리스트</h1><p>노래를 선택하고, 드래그해서 순서를 정해보세요!</p></header><main><section class="panel"><h2>🎵 노래 목록</h2><input class="search" id="search" placeholder="노래 제목 검색"><div class="songs" id="songs"></div><p class="hint">총 87곡 수록. 중복·Inst. 제외, 편곡 버전은 대표곡으로 통합했습니다. 멜론 페이지 2·3의 직접 추출이 제한되어 음반별 트랙 목록과 참여곡 자료로 보완했으며, 멜론 129개 항목과의 1:1 대조는 아직 완료되지 않았습니다.</p></section><section class="panel"><h2>📝 MY SETLIST <span id="count">(0곡)</span></h2><ol class="list" id="list"></ol><div class="actions"><button class="action" id="copy">셋리스트 복사</button><button class="action secondary" id="save">이미지 저장</button><button class="action secondary" id="reset">초기화</button></div><p class="hint">≡ 아이콘을 잡고 드래그하거나 ↑↓ 버튼으로 순서를 바꿔보세요.</p></section></main><script>
// 여기에 실제 곡 제목을 넣으면 됩니다.
const SONGS=["이별직전", "사과 하나를 그려", "ceremony (Feat. 미연 (MIYEON))", "인사(Hello)", "딜리버리(Delivery)", "꿈을 꿨어", "사랑한 마음엔 죄가 없다", "우리의 영화", "밤 시(詩)", "새벽별", "왜 그래", "너의 등장", "목소리", "너를 보네", "Good Bye", "오, 오늘 밤엔", "너는 내(You are)", "마음이니까", "우리 가던 길로 천천히 가자", "AAA", "이 여름 Summer", "괜찮아(Fine)", "셔터 (Shutter)", "있어주면 (Be with me)", "속삭여줘 (DANG!) (Feat. 몽자)", "스위치 (Switch)", "라라라", "기적 (What about you)", "행복", "123", "리코타 치즈 샐러드", "살빼지 마요", "가을목이", "가장 따뜻한 위로", "우리, 여행", "고백직전", "얼음", "오늘밤은 어둠이 무서워요", "너를 공부해", "Perfect Day", "돌아오는 날", "미쳤나봐", "연애의 재구성", "내꺼라면", "시간의 노래", "벚꽃이 내린다", "차라리", "작은 청혼", "유후 (YouWho)", "혹시 자리 비었나요?", "구름의 그림자 위에", "Your Love", "헌터, 운명의 여인을 만나다", "Prince", "기억", "다른 시작", "나만 알고 싶다", "Sunshine", "그런 노래", "여기에 서서", "시험기간 책상정리", "타인이 되어", "잠들 때까지", "잊어야해", "타임머신", "이렇게 행복해", "그때는 왜 몰랐을까", "너에게", "연애 같은 걸 하니까", "To.", "신호등", "몰라", "기다려", "자꾸 생각나", "넌 행복해", "잠이 안 와", "준비된 어깨", "참 이상한 날이야", "타임라인", "그리고 너", "엄마, 기억나"];
const MAX_SONGS = 20;
let chosen=[];try{chosen=JSON.parse(localStorage.getItem('setlist')||'[]').filter(s=>SONGS.includes(s)).slice(0,MAX_SONGS)}catch{};
const songs=document.querySelector('#songs'),list=document.querySelector('#list');const persist=()=>localStorage.setItem('setlist',JSON.stringify(chosen));function render(){let q=document.querySelector('#search').value.trim().toLowerCase();songs.replaceChildren();SONGS.filter(s=>s.toLowerCase().includes(q)).forEach(s=>{let b=document.createElement('button');b.className='song';b.textContent='+ '+s;b.disabled=chosen.includes(s);

b.onclick=()=>{
  if(chosen.length >= MAX_SONGS){
    alert('셋리스트는 최대 20곡까지 선택할 수 있어요! 💙');
    return;
  }

  chosen.push(s);
  persist();
  render();
};songs.append(b)});list.replaceChildren();document.querySelector('#count').textContent=`(${chosen.length} / ${MAX_SONGS}곡)`;if(!chosen.length){let e=document.createElement('div');e.className='empty';e.textContent='왼쪽에서 노래를 선택해 주세요 ✨';list.append(e)}chosen.forEach((s,i)=>{let li=document.createElement('li');li.className='item';li.draggable=true;li.dataset.index=i;let handle=document.createElement('span');handle.className='handle';handle.textContent='≡';let n=document.createElement('span');n.className='number';n.textContent=i+1+'.';let name=document.createElement('span');name.className='name';name.textContent=s;li.append(handle,n,name);for(let [symbol,delta] of [['↑',-1],['↓',1]]){let b=document.createElement('button');b.className='small';b.textContent=symbol;b.setAttribute('aria-label',`${s} ${delta<0?'위':'아래'}로 이동`);b.onclick=()=>move(i,i+delta);li.append(b)}let remove=document.createElement('button');remove.className='small';remove.textContent='×';remove.setAttribute('aria-label',s+' 삭제');remove.onclick=()=>{chosen.splice(i,1);persist();render()};li.append(remove);li.addEventListener('dragstart',e=>{dragIndex=i;li.classList.add('dragging');e.dataTransfer.effectAllowed='move'});li.addEventListener('dragover',e=>e.preventDefault());li.addEventListener('drop',e=>{e.preventDefault();move(dragIndex,i)});li.addEventListener('dragend',()=>li.classList.remove('dragging'));list.append(li)})}let dragIndex=-1;function move(a,b){if(a<0||b<0||a>=chosen.length||b>=chosen.length||a===b)return;chosen.splice(b,0,chosen.splice(a,1)[0]);persist();render()}document.querySelector('#search').oninput=render;document.querySelector('#reset').onclick=()=>{if(!chosen.length||confirm('셋리스트를 초기화할까요?')){chosen=[];persist();render()}};document.querySelector('#copy').onclick=async()=>{let txt='MY SETLIST\n'+chosen.map((s,i)=>`${i+1}. ${s}`).join('\n');try{await navigator.clipboard.writeText(txt);alert('셋리스트가 복사되었어요!')}catch{prompt('아래 내용을 복사하세요',txt)}};
// 이미지 내보내기: 브라우저 기본 Canvas로 외부 라이브러리 없이 PNG 생성
function downloadImage(){let scale=2,w=720,line=58,h=Math.max(320,180+chosen.length*line);let c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;let x=c.getContext('2d');x.scale(scale,scale);x.fillStyle='#f5f8ff';x.fillRect(0,0,w,h);x.fillStyle='#203044';x.font='bold 36px sans-serif';x.fillText('MY SETLIST',48,76);x.fillStyle='#53657c';x.font='20px sans-serif';x.fillText(`${chosen.length} SONGS`,48,113);chosen.forEach((s,i)=>{let y=163+i*line;x.fillStyle='#fff';x.fillRect(40,y-30,640,48);x.fillStyle='#316db1';x.font='bold 19px sans-serif';x.fillText(String(i+1).padStart(2,'0'),57,y);x.fillStyle='#203044';x.font='20px sans-serif';let txt=s;while(x.measureText(txt).width>540&&txt.length>1)txt=txt.slice(0,-2)+'…';x.fillText(txt,108,y)});let a=document.createElement('a');a.download='my-setlist.png';a.href=c.toDataURL('image/png');a.click()}document.querySelector('#save').onclick=downloadImage;
// 모바일 터치 드래그 (핸들만 활성화)
let touchFrom=null;list.addEventListener('pointerdown',e=>{if(!e.target.classList.contains('handle'))return;touchFrom=Number(e.target.closest('.item').dataset.index);e.target.setPointerCapture(e.pointerId)});list.addEventListener('pointerup',e=>{if(touchFrom===null)return;let el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.item');if(el&&list.contains(el))move(touchFrom,Number(el.dataset.index));touchFrom=null});render();</script></body></html>
